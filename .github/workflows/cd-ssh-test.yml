name: HMS CD SSH Test

on:
  push:
    branches: [devops/backend-ci]
    paths:
      - .github/workflows/cd-ssh-test.yml

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test connection to lab06
        env:
          DEPLOY_KEY: ${{ secrets.HMS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HMS_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 2206 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 student@178.18.249.160 'echo SSH_CONNECTION_OK'
