name: HMS Auto CD

on:
  workflow_run:
    workflows: ["HMS Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hms-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build, test and deploy to staging
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          SSH_KEY: ${{ secrets.HMS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HMS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 2206 -o BatchMode=yes -o StrictHostKeyChecking=yes student@178.18.249.160 \
            "bash /home/student/hms-cd-workflow/deploy-commit.sh '$SHA' main && bash /home/student/hms-cd-workflow/activate-staging.sh '$SHA'"
